<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:insert="~{fragments/layout :: head(title=${entry.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <h1 th:text="${entry.name}"></h1>
    <p>Type : <span class="badge text-bg-secondary" th:text="${entry.type}"></span></p>
    <p>Date : <span th:text="${entry.date}"></span></p>
    <p th:if="${entry.description}">Description : <span th:text="${entry.description}"></span></p>
    <p>Créateur : <span th:text="|${entry.creator.name} (${entry.creator.login})|"></span></p>

    <div th:if="${entry.type.name() == 'EVENT'}">
        <p>Fin : <span th:text="${entry.endDate}"></span></p>
        <p>Participants :</p>
        <ul class="list-group">
            <li class="list-group-item" th:each="u : ${entry.participants}" th:text="${u.name}"></li>
        </ul>
    </div>

    <div th:if="${entry.type.name() == 'TASK'}">
        <p>Terminée : <span th:text="${entry.done}"></span><span class="badge text-bg-info ms-2" th:if="${entry.validatedByOther}">Validée manuellement</span></p>
        <form th:if="${entry.creator.login == #authentication.name}"
              th:action="@{/entries/{id}/toggle-validated-by-other(id=${entry.id})}" method="post" class="mb-3">
            <button type="submit" th:class="${entry.validatedByOther} ? 'btn btn-sm btn-outline-secondary' : 'btn btn-sm btn-outline-info'"
                    th:text="${entry.validatedByOther} ? 'Retirer la validation manuelle' : 'Valider manuellement'"></button>
        </form>
        <p>Participants :</p>
        <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="u : ${entry.participants}">
                <span>
                    <span th:text="${u.name}"></span>
                    <span class="badge text-bg-success ms-2" th:if="${entry.contributors.contains(u)}">A contribué</span>
                </span>
                <form th:if="${entry.creator.login == #authentication.name or u.login == #authentication.name}"
                      th:action="@{/entries/{id}/toggle-contrib(id=${entry.id})}" method="post" class="m-0">
                    <input type="hidden" name="targetUserId" th:value="${u.id}"/>
                    <button type="submit" th:class="${entry.contributors.contains(u)} ? 'btn btn-sm btn-outline-secondary' : 'btn btn-sm btn-outline-success'"
                            th:text="${entry.contributors.contains(u)} ? 'Retirer la contribution' : 'Marquer comme contribué'"></button>
                </form>
            </li>
        </ul>
        <form th:if="${!currentUserAssigned}" th:action="@{/entries/{id}/self-assign(id=${entry.id})}" method="post">
            <button type="submit" class="btn btn-outline-primary mb-3">S'assigner</button>
        </form>
        <form th:if="${currentUserAssigned}" th:action="@{/entries/{id}/self-unassign(id=${entry.id})}" method="post">
            <button type="submit" class="btn btn-outline-secondary mb-3">Se désassigner</button>
        </form>
    </div>


    <a href="/" class="btn btn-secondary mt-3">Retour à la liste</a>
    <a th:href="@{/entries/{id}/edit(id=${entry.id})}" class="btn btn-primary mt-3">Modifier</a>
    <button type="button" class="btn btn-danger mt-3" data-bs-toggle="modal" data-bs-target="#deleteModal">Supprimer</button>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Confirmer la suppression</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
                </div>
                <div class="modal-body">
                    Supprimer <strong th:text="${entry.name}"></strong> ? Cette action est irréversible.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <form th:action="@{/entries/{id}/delete(id=${entry.id})}" method="post">
                        <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="alert alert-warning" th:if="${message}" th:text="${message}"></div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
