<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:insert="~{fragments/layout :: head(title='Calendrier')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <h1 class="mb-4">Calendrier</h1>
    <p>
        <a th:href="@{/entries/new(type='EVENT')}" class="btn btn-primary">Nouvel évènement</a>
        <a th:href="@{/entries/new(type='TASK')}" class="btn btn-outline-primary">Nouvelle tâche</a>
    </p>
    <div class="list-group">
        <a th:each="e : ${entries}" th:href="@{/entries/{id}(id=${e.id})}"
           class="list-group-item list-group-item-action">
            <span class="badge text-bg-secondary" th:text="${e.type}"></span>
            <strong th:text="${e.name}"></strong> —
            <span th:text="${e.date}"></span>
            <span th:text="${e.description}"></span>
        </a>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
