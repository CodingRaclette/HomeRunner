<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:insert="~{fragments/layout :: head(title='Liste des utilisateurs')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <h1 class="mb-4">Liste des utilisateurs</h1>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <a th:href="@{/admin/users/new}" class="btn btn-primary mb-3">Nouvel utilisateur</a>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Nom d'utilisateur</th>
            <th>Login</th>
            <th>Email</th>
            <th>Doit changer de mot de passe ?</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${userlist}">
            <td th:text="${u.name}"></td>
            <td th:text="${u.login}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.mustChangePassword}"></td>
            <td>
                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button"
                            th:id="|userActionsDropdown-${u.id}|" data-bs-toggle="dropdown" aria-expanded="false">
                        Actions
                    </button>
                    <ul class="dropdown-menu" th:attr="aria-labelledby=|userActionsDropdown-${u.id}|">
                        <li>
                            <button type="button" class="dropdown-item" data-bs-toggle="modal"
                                    th:attr="data-bs-target=|#resetPasswordModal-${u.id}|">
                                Changer le mot de passe
                            </button>
                        </li>
                    </ul>
                </div>

                <div class="modal fade" th:id="|resetPasswordModal-${u.id}|" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form th:action="@{/admin/users/{id}/reset-password(id=${u.id})}" method="post"
                                  class="reset-password-form">
                                <div class="modal-header">
                                    <h5 class="modal-title">Réinitialiser le mot de passe</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Fermer"></button>
                                </div>
                                <div class="modal-body">
                                    <p>
                                        Nouveau mot de passe pour <strong th:text="${u.name}"></strong>
                                        (<span th:text="${u.login}"></span>)
                                    </p>
                                    <div class="mb-3">
                                        <label class="form-label">Nouveau mot de passe</label>
                                        <input type="password" name="newPassword" class="form-control"
                                               required minlength="8"/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Confirmation</label>
                                        <input type="password" name="confirmPassword" class="form-control"
                                               required minlength="8"/>
                                        <div class="invalid-feedback">Les deux mots de passe ne correspondent pas.</div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                                    <button type="submit" class="btn btn-primary">Réinitialiser</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/reset-password-validation.js}"></script>
</body>
</html>
