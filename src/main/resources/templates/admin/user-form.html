<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:insert="~{fragments/layout :: head(title='Nouvel utilisateur')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 500px;">
    <h1 class="mb-4">Nouvel utilisateur</h1>
    <form th:action="@{/admin/users/new}" th:object="${form}" method="post">
        <div class="mb-3">
            <label class="form-label">Login</label>
            <input type="text" th:field="*{login}" class="form-control"/>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Nom</label>
            <input type="text" th:field="*{name}" class="form-control"/>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control"/>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Mot de passe temporaire</label>
            <input type="password" th:field="*{password}" class="form-control"/>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Creer</button>
    </form>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
