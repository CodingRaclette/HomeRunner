<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:insert="~{fragments/layout :: head(title='Changer le mot de passe')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 500px;">
    <h1 class="mb-4">Changement de mot de passe requis</h1>
    <form th:action="@{${actionPath}}" th:object="${form}" method="post">
        <div class="mb-3">
            <label class="form-label">Mot de passe actuel</label>
            <input type="password" th:field="*{oldPassword}" class="form-control"/>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Nouveau mot de passe</label>
            <input type="password" th:field="*{newPassword}" class="form-control"/>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Confirmation</label>
            <input type="password" th:field="*{confirmPassword}" class="form-control"/>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Valider</button>
    </form>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
